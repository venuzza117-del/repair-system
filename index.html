<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งซ่อมคอมพิวเตอร์ - IT Support</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Kanit', sans-serif; }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header-bg { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; border-radius: 15px 15px 0 0; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 600px;">
    <div class="card card-custom">
        <!-- Header -->
        <div class="card-header header-bg text-center py-4">
            <i class="fa-solid fa-headset fa-3x mb-2"></i>
            <h4 class="mb-0 fw-bold">แจ้งซ่อมคอมพิวเตอร์ห้องเรียน</h4>
            <p class="small mb-0 opacity-75">ศูนย์เทคโนโลยีสารสนเทศ วิทยาลัย...</p>
        </div>

        <div class="card-body p-4">
            <form id="repairForm">
                
                <!-- ข้อมูลที่ดึงจาก QR Code (Readonly) -->
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-door-open"></i> ห้องเรียน</label>
                        <input type="text" id="roomInput" class="form-control bg-light" readonly placeholder="กำลังโหลด...">
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-desktop"></i> เลขเครื่อง</label>
                        <input type="text" id="pcInput" class="form-control bg-light" readonly placeholder="กำลังโหลด...">
                    </div>
                </div>

                <!-- ผู้แจ้งเรื่อง -->
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="fa-solid fa-user"></i> ชื่อผู้แจ้ง / รหัสนักศึกษา</label>
                    <input type="text" class="form-control" placeholder="เช่น นายสมชาย ใจดี (66301...)" required>
                </div>

                <!-- เลือกหมวดหมู่ปัญหา -->
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="fa-solid fa-triangle-exclamation"></i> ประเภทปัญหา</label>
                    <select class="form-select" required>
                        <option value="" selected disabled>-- กรุณาเลือกประเภทปัญหา --</option>
                        <option value="hardware">อุปกรณ์ฮาร์ดแวร์ (จอ ดับ, เมาส์/คีย์บอร์ด เสีย)</option>
                        <option value="software">โปรแกรม / ซอฟต์แวร์ (เข้าไม่ได้, เปิดไม่ติด)</option>
                        <option value="network">ระบบเครือข่าย / อินเทอร์เน็ต</option>
                        <option value="other">อื่นๆ</option>
                    </select>
                </div>

                <!-- รายละเอียดเพิ่มเติม -->
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="fa-solid fa-pen-to-square"></i> รายละเอียดอาการเสีย</label>
                    <textarea class="form-control" rows="3" placeholder="ระบุอาการเพิ่มเติม เช่น เปิดเครื่องแล้วหน้าจอเป็นสีฟ้า..." required></textarea>
                </div>

                <!-- แนบรูปภาพ -->
                <div class="mb-4">
                    <label class="form-label fw-bold"><i class="fa-solid fa-camera"></i> แนบรูปถ่ายหน้าจอ/อุปกรณ์ที่มีปัญหา (ถ้ามี)</label>
                    <input class="form-control" type="file" accept="image/*" capture="environment">
                </div>

                <!-- ปุ่มส่งข้อมูล -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                        <i class="fa-solid fa-paper-plane me-2"></i>ส่งเรื่องแจ้งซ่อม
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- JavaScript อ่านค่าจาก URL Parameter (QR Code) -->
<script>
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const room = urlParams.get('room') || 'ไม่ได้ระบุ';
        const pc = urlParams.get('pc') || 'ไม่ได้ระบุ';

        document.getElementById('roomInput').value = room;
        document.getElementById('pcInput').value = pc;
    };
</script>

</body>
</html>
